<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1117"/>
      <stop offset="100%" style="stop-color:#13141e"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4f8ef7;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#4f8ef7;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#4f8ef7;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4f8ef7;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#4f8ef7;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4f8ef7"/>
      <stop offset="100%" style="stop-color:#34d399"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <clipPath id="chartClip">
      <rect x="680" y="100" width="460" height="400" rx="16"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Ambient glow blobs -->
  <circle cx="200" cy="150" r="300" fill="#4f8ef7" opacity="0.04" filter="url(#blur)"/>
  <circle cx="1000" cy="480" r="250" fill="#34d399" opacity="0.04" filter="url(#blur)"/>

  <!-- Grid lines (subtle) -->
  <line x1="0" y1="210" x2="1200" y2="210" stroke="#1e2025" stroke-width="1"/>
  <line x1="0" y1="420" x2="1200" y2="420" stroke="#1e2025" stroke-width="1"/>
  <line x1="300" y1="0" x2="300" y2="630" stroke="#1e2025" stroke-width="1"/>
  <line x1="600" y1="0" x2="600" y2="630" stroke="#1e2025" stroke-width="1"/>
  <line x1="900" y1="0" x2="900" y2="630" stroke="#1e2025" stroke-width="1"/>

  <!-- Horizontal glow band -->
  <rect x="0" y="260" width="1200" height="110" fill="url(#glow)"/>

  <!-- ── Chart panel (right) ── -->
  <rect x="680" y="100" width="460" height="400" rx="16" fill="#12131c" stroke="#1e2025" stroke-width="1"/>

  <!-- Chart area fill -->
  <polygon points="700,420 740,370 780,380 820,320 870,290 920,300 960,240 1000,210 1040,250 1080,190 1120,170 1120,460 700,460" fill="url(#chartGrad)" clip-path="url(#chartClip)"/>

  <!-- Chart line -->
  <polyline points="700,420 740,370 780,380 820,320 870,290 920,300 960,240 1000,210 1040,250 1080,190 1120,170"
    fill="none" stroke="#4f8ef7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" clip-path="url(#chartClip)"/>

  <!-- Volume bars -->
  <rect x="700" y="445" width="14" height="10" rx="2" fill="rgba(52,211,153,0.5)" clip-path="url(#chartClip)"/>
  <rect x="740" y="442" width="14" height="13" rx="2" fill="rgba(248,113,113,0.5)" clip-path="url(#chartClip)"/>
  <rect x="780" y="448" width="14" height="7" rx="2" fill="rgba(52,211,153,0.5)" clip-path="url(#chartClip)"/>
  <rect x="820" y="444" width="14" height="11" rx="2" fill="rgba(52,211,153,0.5)" clip-path="url(#chartClip)"/>
  <rect x="870" y="440" width="14" height="15" rx="2" fill="rgba(52,211,153,0.5)" clip-path="url(#chartClip)"/>
  <rect x="920" y="446" width="14" height="9" rx="2" fill="rgba(248,113,113,0.5)" clip-path="url(#chartClip)"/>
  <rect x="960" y="437" width="14" height="18" rx="2" fill="rgba(52,211,153,0.5)" clip-path="url(#chartClip)"/>
  <rect x="1000" y="435" width="14" height="20" rx="2" fill="rgba(52,211,153,0.5)" clip-path="url(#chartClip)"/>
  <rect x="1040" y="443" width="14" height="12" rx="2" fill="rgba(248,113,113,0.5)" clip-path="url(#chartClip)"/>
  <rect x="1080" y="432" width="14" height="23" rx="2" fill="rgba(52,211,153,0.5)" clip-path="url(#chartClip)"/>
  <rect x="1106" y="428" width="14" height="27" rx="2" fill="rgba(52,211,153,0.5)" clip-path="url(#chartClip)"/>

  <!-- SMA20 overlay -->
  <polyline points="820,340 870,315 920,310 960,268 1000,238 1040,240 1080,210 1120,192"
    fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.8" clip-path="url(#chartClip)"/>

  <!-- Chart header -->
  <rect x="680" y="100" width="460" height="44" rx="16" fill="#16172080"/>
  <rect x="680" y="128" width="460" height="16" fill="#16172080"/>
  <text x="706" y="127" font-family="'JetBrains Mono', monospace" font-size="13" fill="#6b7280">SAMSUNG  005930.KS</text>
  <text x="1080" y="127" font-family="'JetBrains Mono', monospace" font-size="13" fill="#34d399" text-anchor="end">+2.47%</text>

  <!-- ── Left content ── -->

  <!-- Logo icon -->
  <rect x="80" y="95" width="56" height="56" rx="14" fill="rgba(79,142,247,0.12)" stroke="rgba(79,142,247,0.2)" stroke-width="1"/>
  <path d="M96 123 L106 113 L112 119 L122 109" stroke="#4f8ef7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <circle cx="122" cy="109" r="3" fill="#34d399"/>

  <!-- StockLens wordmark -->
  <text x="152" y="131" font-family="Inter, sans-serif" font-size="38" font-weight="700" fill="#f1f2f6" letter-spacing="-1">StockLens</text>

  <!-- Tagline -->
  <text x="80" y="200" font-family="Inter, sans-serif" font-size="42" font-weight="700" fill="#f1f2f6" letter-spacing="-1.5">AI 기반 주식 분석</text>
  <text x="80" y="252" font-family="Inter, sans-serif" font-size="42" font-weight="700" letter-spacing="-1.5">
    <tspan fill="url(#accent)">한눈에 끝내세요.</tspan>
  </text>

  <!-- Description -->
  <text x="80" y="310" font-family="Inter, sans-serif" font-size="19" fill="#6b7280" letter-spacing="-0.3">
    미국 · 한국 주식 검색 → 기술적 지표 + Gemini AI 투자 의견까지
  </text>

  <!-- Divider -->
  <line x1="80" y1="348" x2="580" y2="348" stroke="#1e2025" stroke-width="1"/>

  <!-- Feature pills -->
  <!-- RSI -->
  <rect x="80" y="368" width="88" height="32" rx="8" fill="rgba(79,142,247,0.1)" stroke="rgba(79,142,247,0.2)" stroke-width="1"/>
  <text x="124" y="389" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#4f8ef7" text-anchor="middle">RSI · MACD</text>

  <!-- SMA -->
  <rect x="178" y="368" width="68" height="32" rx="8" fill="rgba(251,191,36,0.1)" stroke="rgba(251,191,36,0.2)" stroke-width="1"/>
  <text x="212" y="389" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#fbbf24" text-anchor="middle">SMA 20</text>

  <!-- AI -->
  <rect x="256" y="368" width="108" height="32" rx="8" fill="rgba(52,211,153,0.1)" stroke="rgba(52,211,153,0.2)" stroke-width="1"/>
  <text x="310" y="389" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#34d399" text-anchor="middle">Gemini AI 분석</text>

  <!-- KR stocks -->
  <rect x="374" y="368" width="112" height="32" rx="8" fill="rgba(248,113,113,0.1)" stroke="rgba(248,113,113,0.2)" stroke-width="1"/>
  <text x="430" y="389" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#f87171" text-anchor="middle">한국 주식 지원</text>

  <!-- Score card preview -->
  <rect x="80" y="430" width="240" height="90" rx="12" fill="#12131c" stroke="#1e2025" stroke-width="1"/>
  <text x="104" y="456" font-family="Inter, sans-serif" font-size="11" fill="#6b7280" letter-spacing="0.5">AI 투자 의견</text>
  <circle cx="280" cy="470" r="26" fill="none" stroke="#1e2025" stroke-width="4"/>
  <circle cx="280" cy="470" r="26" fill="none" stroke="#34d399" stroke-width="4"
    stroke-dasharray="113 163" stroke-dashoffset="41" transform="rotate(-90 280 470)"/>
  <text x="280" y="474" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#34d399" text-anchor="middle">78</text>
  <rect x="104" y="465" width="60" height="26" rx="6" fill="rgba(52,211,153,0.15)"/>
  <text x="134" y="483" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#34d399" text-anchor="middle">매수</text>
  <text x="104" y="507" font-family="Inter, sans-serif" font-size="11" fill="#6b7280">강한 상승 신호 감지</text>

  <!-- Bottom bar -->
  <rect x="0" y="590" width="1200" height="40" fill="#0d0e14"/>
  <text x="80" y="614" font-family="Inter, sans-serif" font-size="13" fill="#3a3d4d">stocklens.app</text>
  <text x="1120" y="614" font-family="Inter, sans-serif" font-size="13" fill="#3a3d4d" text-anchor="end">Powered by Yahoo Finance · Gemini AI</text>
</svg>
